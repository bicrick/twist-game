<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twist</title>
<style>
:root { --bg: #d9d2c5; --floor: #ece6da; --wall: #4a4338; --line: rgba(0,0,0,.07);
        --player: #ff9f40; --block: #f2b705; --home: #37b36b; --okc: #2fc27a; --badc: #ee5b5b; --plain: #1fb5a3; --twist: #8b5cf6; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); transition: background .5s ease; font-family: system-ui, sans-serif;
       display: flex; align-items: center; justify-content: center; overflow: hidden; user-select: none; }
#stage { position: relative; }
#floor { position: relative; display: grid; background: var(--floor); border-radius: 8px;
         box-shadow: 0 10px 0 rgba(0,0,0,.12); transition: background .5s ease; }
.cell { position: relative; }
.cell.wall::before { content: ''; position: absolute; inset: 4%; background: var(--wall); border-radius: var(--rad);
                     box-shadow: inset 0 -7px 0 rgba(0,0,0,.2), inset 0 5px 0 rgba(255,255,255,.08), 0 4px 0 rgba(0,0,0,.16); }
.edge { position: absolute; z-index: 6; pointer-events: none; border-radius: 4px; }
.edge.plain { background: var(--plain); box-shadow: 0 0 14px var(--plain); }
.edge.twist { background: var(--twist); box-shadow: 0 0 14px var(--twist); }
.edge.none { background: var(--wall); opacity: .85; }
.chev { position: absolute; z-index: 6; display: flex; pointer-events: none; opacity: .62; font-weight: 700; }
.chev > span { flex: 1; display: flex; align-items: center; justify-content: center; line-height: 1; }
.chev.plain { color: var(--plain); } .chev.twist { color: var(--twist); }
.piece { position: absolute; border-radius: 13%; background: var(--c); z-index: 5;
         box-shadow: 0 4px 0 rgba(0,0,0,.2); transition: left .12s ease, top .12s ease, opacity .12s ease; }
.piece .face { position: absolute; inset: 0; transition: transform .22s ease; }
.eye { position: absolute; top: 22%; width: 24%; height: 26%; background: #fff; border-radius: 50%; }
.eye.l { left: 20%; } .eye.r { left: 56%; }
.eye::after { content: ''; position: absolute; right: 8%; top: 28%; width: 50%; height: 50%; background: #1d1d1d; border-radius: 50%; }
.cheek { position: absolute; right: 14%; bottom: 16%; width: 30%; height: 13%; border-radius: 99px; background: rgba(0,0,0,.2); }
.piece.blk { background: transparent; box-shadow: none; filter: drop-shadow(0 5px 0 rgba(0,0,0,.17)); }
.piece.blk .face { display: flex; align-items: center; justify-content: center; }
.piece.blk .face svg { width: 100%; height: 100%; padding: 2%; overflow: visible; }
.bb { fill: #ffd84a; stroke: #c99700; stroke-width: 3.5; stroke-linejoin: round; }
.bs { fill: #7a4b1d; } .bt { fill: #5a3714; }
.piece.ghost.blk { border: none; background: none; border-radius: 50%; box-shadow: none; filter: none; }
.piece.ghost.blk .bb { fill: color-mix(in srgb, var(--c) 16%, transparent); stroke: var(--c); stroke-width: 4.5; stroke-dasharray: 7 5; }
.piece.ghost.blk .face svg { transform: scale(1.16); }
.piece.ghost.blk .bs, .piece.ghost.blk .bt { fill: var(--c); opacity: .75; }
.piece.ghost.blk.ok { border: 0; background: none; box-shadow: none; filter: drop-shadow(0 0 9px var(--okc)); }
.piece.ghost.blk.ok .bb { fill: color-mix(in srgb, var(--okc) 32%, transparent); stroke-dasharray: none; }
.piece.player { --c: var(--player); }
.piece.blk { --c: var(--block); }
.piece.ghost { background: color-mix(in srgb, var(--c) 13%, transparent); border: 3px dashed var(--c); box-shadow: none; z-index: 2;
               transition: left .12s ease, top .12s ease, background .25s ease, border-color .25s ease, box-shadow .25s ease; }
.piece.ghost .face { opacity: .8; }
.piece.ghost .eye { background: rgba(255,255,255,.92); box-shadow: inset 0 0 0 2.5px var(--c); }
.piece.ghost .eye::after { background: var(--c); }
.piece.ghost .cheek { background: var(--c); opacity: .55; }
.piece.ghost.ok { --c: var(--okc); border-style: solid; background: color-mix(in srgb, var(--okc) 30%, transparent);
                  box-shadow: 0 0 0 4px color-mix(in srgb, var(--okc) 28%, transparent), 0 0 22px color-mix(in srgb, var(--okc) 70%, transparent); } 
.piece.ghost.pinging::after { content: ''; position: absolute; inset: -3px; border: 4px solid var(--okc); border-radius: inherit;
                              animation: ping .65s ease-out forwards; pointer-events: none; }
@keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(1.7); opacity: 0; } }
#dots { position: fixed; top: 18px; left: 0; right: 0; display: flex; gap: 10px; justify-content: center; z-index: 30; pointer-events: none; }
#dots i { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--block); background: transparent; transition: all .25s ease; }
#dots i.home { border-color: var(--home); }
#dots i.on { background: var(--block); transform: scale(1.2); box-shadow: 0 0 10px var(--block); }
#dots i.home.on { background: var(--home); box-shadow: 0 0 10px var(--home); }
.piece.ghost.blk { --c: var(--block); } .piece.ghost.home { --c: var(--home); }
.piece.ghost.blk.ok, .piece.ghost.home.ok { --c: var(--okc); }
.lvl { position: absolute; border-radius: 12%; z-index: 4; box-shadow: 0 4px 0 rgba(0,0,0,.22); overflow: hidden;
       display: flex; align-items: center; justify-content: center; }
.lvl .num { position: absolute; left: 6%; top: 3%; font: 800 calc(var(--cell) * .2)/1 system-ui; color: rgba(255,255,255,.95); z-index: 3; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.lvl .tick { position: absolute; right: 5%; top: 5%; width: 26%; height: 26%; border-radius: 50%; background: #37b36b; color: #fff;
             font: 800 calc(var(--cell) * .17)/1 system-ui; display: flex; align-items: center; justify-content: center; z-index: 3; }
.mini { position: relative; display: grid; border-radius: 3px; }
.mini i { display: block; }
.copy { position: absolute; z-index: 1; display: grid; background: var(--floor); border-radius: 8px; transition: background .5s ease; }
body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 20;
              background: radial-gradient(ellipse at center, transparent 55%, color-mix(in srgb, var(--bg) 70%, transparent) 100%); }
#chip { z-index: 30; position: fixed; left: 18px; top: 14px; font: 800 20px system-ui; color: rgba(0,0,0,.28); }
#hint { z-index: 30; position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; font: 13px system-ui; color: rgba(0,0,0,.38); letter-spacing: .3px; }
@keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.035); } 100% { transform: scale(1); } }
.win #floor { animation: pulse .6s ease; }
.win .piece.player, .win .piece.blk { animation: pulse .6s ease; }
</style>

<div id="chip"></div>
<div id="dots"></div>
<div id="stage"></div>
<div id="hint"></div>

<script>
// ---- ENGINE ----
function parseLevel(d) {
  const walls = new Set((d.walls || []).map(w => w[0] + ',' + w[1]));
  const o = a => ({ r: a[0], c: a[1], fx: a[2] || 0, fy: a[3] || 0 });
  return {
    L: { W: d.w, H: d.h, walls, lr: d.lr, tb: d.tb, targets: d.targets.map(o), home: o(d.home),
         pads: new Map((d.pads || []).map(p => [p[0] + ',' + p[1], p[2]])) },
    player: o(d.player), blocks: d.blocks.map(o)
  };
}
// neighbour of (r,c) in direction (dr,dc), through glued edges. tw says which twisted seam was crossed.
function nxt(L, r, c, dr, dc) {
  let nr = r + dr, nc = c + dc, tw = null;
  if (nc < 0 || nc >= L.W) {
    if (L.lr === 'none') return null;
    nc = (nc + L.W) % L.W;
    if (L.lr === 'twist') { nr = L.H - 1 - nr; tw = 'lr'; }
  } else if (nr < 0 || nr >= L.H) {
    if (L.tb === 'none') return null;
    nr = (nr + L.H) % L.H;
    if (L.tb === 'twist') { nc = L.W - 1 - nc; tw = 'tb'; }
  }
  if (L.walls.has(nr + ',' + nc)) return null;
  return { r: nr, c: nc, tw, pad: L.pads.get(nr + ',' + nc) || null };
}
// a piece flips when it crosses a twisted seam, and when it enters a mirror pad (x: left-right, y: up-down)
function flip(o, tw, pad) {
  let fx = o.fx, fy = o.fy;
  if (tw === 'tb') fx ^= 1;
  if (tw === 'lr') fy ^= 1;
  if (pad === 'x') fx ^= 1;
  if (pad === 'y') fy ^= 1;
  return { ...o, fx, fy };
}
// keys always mean the same direction; only orientation of pieces changes at twisted seams
function step(s, dr, dc) {
  const L = s.L, p = s.player;
  const n = nxt(L, p.r, p.c, dr, dc);
  if (!n) return null;
  const at = (r, c) => s.blocks.findIndex(b => b.r === r && b.c === c);
  const moves = [];
  let cur = n, guard = 0;
  while (at(cur.r, cur.c) >= 0) {
    if (++guard > L.W * L.H) return null;
    const m = nxt(L, cur.r, cur.c, dr, dc);
    if (!m) return null;
    moves.push([at(cur.r, cur.c), m]);
    cur = m;
  }
  const blocks = s.blocks.map(b => ({ ...b }));
  for (const [i, m] of moves) blocks[i] = { ...flip(blocks[i], m.tw, m.pad), r: m.r, c: m.c };
  const player = { ...flip(p, n.tw, n.pad), r: n.r, c: n.c };
  return { ...s, player, blocks };
}
const same = (a, b) => a.r === b.r && a.c === b.c && a.fx === b.fx && a.fy === b.fy;
function targetDone(s, t) { return s.blocks.some(b => same(b, t)); }
function homeDone(s) { return same(s.player, s.L.home); }
function isWin(s) { return s.L.targets.every(t => targetDone(s, t)) && homeDone(s); }

// ---- LEVELS ----
const LEVELS = [{"name":"wrap","w":5,"h":1,"lr":"plain","tb":"none","walls":[],"player":[0,2],"blocks":[[0,1]],"targets":[[0,4]],"home":[0,1]},{"name":"mirror","w":5,"h":3,"lr":"twist","tb":"none","walls":[],"player":[0,2],"blocks":[[0,3]],"targets":[[2,0,0,1]],"home":[2,2,0,1]},{"name":"flip","w":5,"h":3,"lr":"twist","tb":"none","walls":[],"player":[1,1,1,1],"home":[1,4,1,1],"blocks":[[1,0,0,0]],"targets":[[1,3,0,0]]},{"name":"around","w":5,"h":3,"lr":"twist","tb":"plain","walls":[[1,0]],"player":[2,2,0,1],"home":[0,0,0,1],"blocks":[[0,4,0,0]],"targets":[[0,1,0,0]]},{"name":"two ways","w":5,"h":3,"lr":"twist","tb":"plain","walls":[[0,1],[2,1]],"player":[1,3,0,1],"home":[2,3,0,1],"blocks":[[0,2,1,1]],"targets":[[0,4,1,1]]},{"name":"both seams","w":4,"h":4,"lr":"twist","tb":"twist","walls":[[1,1]],"player":[2,0,0,1],"home":[0,1,1,0],"blocks":[[3,0,1,1]],"targets":[[3,2,1,0]]},{"name":"long way round","w":4,"h":4,"lr":"twist","tb":"twist","walls":[[2,0]],"player":[0,1,1,1],"home":[3,2,0,0],"blocks":[[3,0,0,1]],"targets":[[0,3,1,1]]},{"name":"pair","w":4,"h":3,"lr":"twist","tb":"twist","walls":[[0,2]],"player":[2,1,0,0],"home":[2,0,1,1],"blocks":[[2,0,1,0],[1,3,1,0]],"targets":[[2,1,1,0],[1,1,0,0]]},{"name":"pair, twisted","w":4,"h":3,"lr":"twist","tb":"twist","walls":[[0,2]],"player":[2,2,1,1],"home":[1,3,1,1],"blocks":[[1,2,1,1],[0,3,0,1]],"targets":[[2,3,0,0],[2,0,0,0]]}];

// ---- UI ----
if (typeof document !== 'undefined') {
  const $ = id => document.getElementById(id);
  const N = LEVELS.length, COLS = 3, ROWS = Math.ceil(N / COLS), HW = 7, HH = 2 * ROWS + 1;
  let mode = 'hub', li = 0, state = null, hist = [], prev = {}, locked = false;
  let hubPlayer = [HH - 1, 3], CELL = 64, done = {};
  try { done = JSON.parse(localStorage.getItem('twist-done') || '{}'); } catch (e) {}
  const saveDone = () => { try { localStorage.setItem('twist-done', JSON.stringify(done)); } catch (e) {} };
  const hueOf = i => (i * 47 + 200) % 360;
  const boxPos = i => [1 + 2 * Math.floor(i / COLS), 1 + 2 * (i % COLS)];

  function theme(h) {
    const b = document.body.style;
    if (h === null) { b.setProperty('--bg', '#d9d2c5'); b.setProperty('--floor', '#ece6da'); b.setProperty('--wall', '#4a4338'); return; }
    b.setProperty('--bg', `hsl(${h} 34% 70%)`);
    b.setProperty('--floor', `hsl(${h} 38% 86%)`);
    b.setProperty('--wall', `hsl(${h} 28% 28%)`);
  }
  const el = (cls, parent) => { const d = document.createElement('div'); d.className = cls; if (parent) parent.appendChild(d); return d; };
  function piece(cls, parent, size) {
    const d = el('piece ' + cls, parent);
    d.style.width = d.style.height = size + 'px';
    d.f = el('face', d);
    d.f.innerHTML = cls.includes('blk')
      ? '<svg viewBox="0 0 100 100"><path class="bb" d="M24 22 C 8 62, 40 92, 88 76 C 54 68, 38 48, 38 24 Z"/>' +
        '<path class="bs" d="M24 22 L 27 9 L 37 11 L 38 24 Z"/><circle class="bt" cx="87" cy="76" r="4.5"/></svg>'
      : '<i class="eye l"></i><i class="eye r"></i><i class="cheek"></i>';
    return d;
  }
  function orient(node, o) { node.f.style.transform = 'scale(' + (o.fx ? -1 : 1) + ',' + (o.fy ? -1 : 1) + ')'; }
  function fit(W, H) {
    return Math.max(34, Math.min(88, Math.floor(Math.min((innerWidth - 110) / W, (innerHeight - 170) / H))));
  }
  function bars(floor, L) {
    const W = L.W * CELL, H = L.H * CELL, t = 4, g = Math.round(CELL * .22), gap = 7;
    const line = (type, css) => { const d = el('edge ' + type, floor); Object.assign(d.style, css); };
    const chev = (type, css, glyphs, col) => {
      if (type === 'none') return;
      const d = el('chev ' + type, floor); Object.assign(d.style, css);
      d.style.flexDirection = col ? 'column' : 'row'; d.style.fontSize = Math.round(g * .95) + 'px';
      glyphs.forEach(x => { const s = document.createElement('span'); s.textContent = x; d.appendChild(s); });
    };
    const cols = Array.from({ length: L.W }), rows = Array.from({ length: L.H });
    const tw = L.tb === 'twist', lw = L.lr === 'twist';
    line(L.tb, { left: '-2px', top: -t / 2 + 'px', width: W + 4 + 'px', height: t + 'px' });
    line(L.tb, { left: '-2px', top: H - t / 2 + 'px', width: W + 4 + 'px', height: t + 'px' });
    line(L.lr, { left: -t / 2 + 'px', top: '-2px', width: t + 'px', height: H + 4 + 'px' });
    line(L.lr, { left: W - t / 2 + 'px', top: '-2px', width: t + 'px', height: H + 4 + 'px' });
    chev(L.tb, { left: 0, top: -g - gap + 'px', width: W + 'px', height: g + 'px' }, cols.map(() => '\u2192'), false);
    chev(L.tb, { left: 0, top: H + gap + 'px', width: W + 'px', height: g + 'px' }, cols.map(() => tw ? '\u2190' : '\u2192'), false);
    chev(L.lr, { left: -g - gap + 'px', top: 0, width: g + 'px', height: H + 'px' }, rows.map(() => '\u2193'), true);
    chev(L.lr, { left: W + gap + 'px', top: 0, width: g + 'px', height: H + 'px' }, rows.map(() => lw ? '\u2191' : '\u2193'), true);
  }
  function preview(def, box) {
    const s = Math.max(4, Math.floor((box * .74) / Math.max(def.w, def.h)));
    const m = el('mini');
    m.style.gridTemplateColumns = `repeat(${def.w}, ${s}px)`; m.style.gridAutoRows = s + 'px';
    m.style.background = 'rgba(255,255,255,.55)';
    const edge = t => t === 'twist' ? 'var(--twist)' : t === 'plain' ? 'var(--plain)' : 'rgba(0,0,0,.55)';
    m.style.borderTop = m.style.borderBottom = `${Math.max(2, s / 4)}px solid ${edge(def.tb)}`;
    m.style.borderLeft = m.style.borderRight = `${Math.max(2, s / 4)}px solid ${edge(def.lr)}`;
    const walls = new Set(def.walls.map(w => w.join())), blocks = new Set(def.blocks.map(b => b[0] + ',' + b[1]));
    const tg = new Set(def.targets.map(b => b[0] + ',' + b[1]));
    for (let r = 0; r < def.h; r++) for (let c = 0; c < def.w; c++) {
      const k = r + ',' + c, i = document.createElement('i');
      i.style.width = i.style.height = s + 'px';
      if (walls.has(k)) { i.style.background = 'rgba(0,0,0,.6)'; i.style.borderRadius = '38%'; }
      else if (blocks.has(k)) { i.style.background = 'var(--block)'; i.style.borderRadius = '30%'; i.style.transform = 'scale(.7)'; }
      else if (k === def.player[0] + ',' + def.player[1]) { i.style.background = 'var(--player)'; i.style.borderRadius = '30%'; i.style.transform = 'scale(.7)'; }
      else if (tg.has(k)) { i.style.border = '2px solid var(--block)'; i.style.borderRadius = '30%'; i.style.transform = 'scale(.7)'; }
      else if (k === def.home[0] + ',' + def.home[1]) { i.style.border = '2px solid var(--home)'; i.style.borderRadius = '30%'; i.style.transform = 'scale(.7)'; }
      m.appendChild(i);
    }
    return m;
  }

  // ---------- hub ----------
  function buildHub() {
    mode = 'hub'; theme(null);
    CELL = fit(HW, HH);
    const st = $('stage'); st.innerHTML = ''; st.classList.remove('win');
    st.style.setProperty('--cell', CELL + 'px');
    const floor = el('', st); floor.id = 'floor';
    floor.style.gridTemplateColumns = `repeat(${HW}, ${CELL}px)`; floor.style.gridAutoRows = CELL + 'px';
    for (let i = 0; i < HW * HH; i++) el('cell', floor);
    const size = Math.round(CELL * .86), off = (CELL - size) / 2;
    LEVELS.forEach((d, i) => {
      const [r, c] = boxPos(i), b = el('lvl', floor);
      b.style.width = b.style.height = size + 'px';
      b.style.left = c * CELL + off + 'px'; b.style.top = r * CELL + off + 'px';
      b.style.background = `hsl(${hueOf(i)} 45% 62%)`;
      b.appendChild(preview(d, size));
      const n = el('num', b); n.textContent = i + 1;
      if (done[i]) { const t = el('tick', b); t.textContent = '✓'; }
    });
    const p = piece('player', floor, Math.round(CELL * .76)); orient(p, { fx: 0, fy: 0 });
    p.style.transition = 'left .1s ease, top .1s ease';
    const place = () => { p.style.left = hubPlayer[1] * CELL + CELL * .12 + 'px'; p.style.top = hubPlayer[0] * CELL + CELL * .12 + 'px'; };
    place();
    st.hubPlace = place;
    $('chip').textContent = ''; $('hint').textContent = 'WASD move  ·  walk into a level to enter it';
  }
  function hubMove(dr, dc) {
    const r = hubPlayer[0] + dr, c = hubPlayer[1] + dc;
    if (r < 0 || c < 0 || r >= HH || c >= HW) return;
    const i = LEVELS.findIndex((_, k) => { const [br, bc] = boxPos(k); return br === r && bc === c; });
    if (i >= 0) { enter(i); return; }
    hubPlayer = [r, c]; $('stage').hubPlace();
  }

  // ---------- level ----------
  function enter(i) {
    mode = 'level'; li = i; state = parseLevel(LEVELS[i]); hist = []; dirs.length = 0; prev = {}; locked = false;
    buildLevel();
  }
  let worlds = [];
  const RADS = ['38% 24% 34% 28% / 30% 38% 26% 36%', '26% 36% 28% 40% / 38% 26% 36% 28%',
                '32% 30% 40% 24% / 26% 40% 28% 34%', '24% 40% 26% 34% / 36% 28% 38% 30%'];
  function addCells(root, L) {
    for (let r = 0; r < L.H; r++) for (let c = 0; c < L.W; c++) {
      const wall = L.walls.has(r + ',' + c), d = el('cell' + (wall ? ' wall' : ''), root);
      if (wall) d.style.setProperty('--rad', RADS[(r * 3 + c * 5 + r * c) % 4]);
    }
  }
  function makeWorld(root, L, k, big, small) {
    return { k, big, small,
      tg: L.targets.map(() => piece('ghost blk', root, big)), home: piece('ghost home', root, small),
      bl: state.blocks.map(() => piece('blk', root, big)), pl: piece('player', root, small) };
  }
  function buildLevel() {
    const L = state.L; theme(hueOf(li));
    CELL = fit(L.W + 1.8, L.H + 1.8);
    const st = $('stage'); st.innerHTML = ''; st.classList.remove('win');
    st.style.setProperty('--cell', CELL + 'px');
    st.style.margin = Math.round(CELL * .3) + 'px';
    const floor = el('', st); floor.id = 'floor';
    floor.style.gridTemplateColumns = `repeat(${L.W}, ${CELL}px)`; floor.style.gridAutoRows = CELL + 'px';
    addCells(floor, L);
    const big = Math.round(CELL * .8), small = Math.round(CELL * .76);
    worlds = [];
    // reflections of the world beyond every glued edge, tiled until they fill the screen.
    // twisted edges show it mirrored; further copies fade and blur.
    const bw = L.W * CELL, bh = L.H * CELL;
    const nI = L.lr === 'none' ? 0 : Math.min(7, Math.ceil((innerWidth / 2 - bw / 2) / bw) + 1);
    const nJ = L.tb === 'none' ? 0 : Math.min(7, Math.ceil((innerHeight / 2 - bh / 2) / bh) + 1);
    for (let i = -nI; i <= nI; i++) for (let j = -nJ; j <= nJ; j++) {
      if (!i && !j) continue;
      const d = Math.max(Math.abs(i), Math.abs(j));
      const cp = el('copy', floor);
      cp.style.left = i * bw + 'px'; cp.style.top = j * bh + 'px';
      cp.style.gridTemplateColumns = `repeat(${L.W}, ${CELL}px)`; cp.style.gridAutoRows = CELL + 'px';
      cp.style.width = bw + 'px'; cp.style.height = bh + 'px';
      cp.style.opacity = Math.max(.1, .5 * Math.pow(.66, d - 1));
