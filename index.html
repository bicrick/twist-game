<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="botGrad" cx=".5" cy=".4" r=".68">
    <stop offset="0" style="stop-color: color-mix(in srgb, var(--player) 62%, #fff)"/>
    <stop offset=".55" style="stop-color: var(--player)"/>
    <stop offset="1" style="stop-color: color-mix(in srgb, var(--player) 80%, #000)"/>
  </radialGradient>
  <radialGradient id="blkGrad" cx=".5" cy=".4" r=".68">
    <stop offset="0" style="stop-color: color-mix(in srgb, var(--block) 60%, #fff)"/>
    <stop offset=".55" style="stop-color: var(--block)"/>
    <stop offset="1" style="stop-color: color-mix(in srgb, var(--block) 78%, #000)"/>
  </radialGradient>
  <g id="shapes"></g>
</defs></svg>
<div id="live" class="sr" aria-live="polite" role="status"></div>
<div id="device">
  <div id="screen">
    <div id="top"><div id="bar"><div id="dots"></div></div></div>
    <div id="stage"></div>
  </div>
  <div id="pad"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
